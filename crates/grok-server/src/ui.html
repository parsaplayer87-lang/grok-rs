<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>grok-rs</title>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--line:#232a33;--fg:#e6edf3;--mut:#8b98a5;--acc:#4c9aff;--ok:#3fb950;--err:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header b{font-size:15px;letter-spacing:.3px}
header .sp{flex:1}
button{background:#1d242c;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
main{flex:1;display:flex;min-height:0}
#side{width:250px;border-inline-end:1px solid var(--line);overflow:auto;padding:8px;background:var(--panel)}
#side .c{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side .c:hover{background:#1b222a;color:var(--fg)}
#side .c.on{background:#1f2937;color:var(--fg)}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.m{max-width:820px;width:100%;margin:0 auto}
.m .who{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.m .b{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;word-wrap:break-word}
.m.u .b{background:#182533;border-color:#24384d}
.m .r{border-inline-start:2px solid var(--acc);padding:6px 10px;margin-bottom:8px;color:var(--mut);font-size:13px;white-space:pre-wrap}
.m .t{background:#11161c;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:12px;color:var(--mut);font-family:ui-monospace,Consolas,monospace}
.m .cite{font-size:12px;color:var(--mut);margin-top:6px}
.m .cite a{color:var(--acc)}
footer{border-top:1px solid var(--line);padding:10px 14px;background:var(--panel)}
.row{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;background:#0f141a;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;resize:none;max-height:160px;min-height:44px}
.opts{max-width:820px;margin:6px auto 0;display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:520px;width:92vw}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 12px}
dialog label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
dialog input,dialog select{width:100%;background:#0f141a;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.err{color:var(--err)}
[dir=rtl] .m .r{border-inline-start:none;border-inline-end:2px solid var(--acc)}
@media(max-width:720px){#side{display:none}}
</style>
</head>
<body>
<header>
  <b>grok-rs</b>
  <span id="model" style="color:var(--mut);font-size:12px"></span>
  <span class="sp"></span>
  <button onclick="newChat()">+ New</button>
  <button onclick="openSettings()">Settings</button>
</header>
<main>
  <div id="side"></div>
  <div id="chat">
    <div id="log"></div>
    <footer>
      <div class="row">
        <textarea id="in" rows="1" placeholder="Message…  (Enter to send, Shift+Enter for newline)"></textarea>
        <button class="p" id="send" onclick="send()">Send</button>
        <button id="stop" onclick="stop()" style="display:none">Stop</button>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="agent"> Agent + tools</label>
        <label><input type="checkbox" id="reason"> Reasoning</label>
        <label><input type="checkbox" id="search"> Web search</label>
        <label><input type="checkbox" id="img"> Image generation</label>
        <label><input type="checkbox" id="temp"> Temporary</label>
        <span id="usage" style="margin-inline-start:auto"></span>
      </div>
    </footer>
  </div>
</main>

<dialog id="dlg">
  <h3>Provider</h3>
  <label>Preset</label>
  <select id="preset" onchange="applyPreset()"></select>
  <label>Base URL</label><input id="base" placeholder="https://api.x.ai/v1">
  <label>API key</label><input id="key" type="password" placeholder="paste key">
  <label>Model</label><input id="mdl" placeholder="grok-4-1">
  <label>Language</label><select id="lang"><option value="en">English</option><option value="fa">فارسی</option></select>
  <label>System prompt</label><input id="sys">
  <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
    <button onclick="dlg.close()">Cancel</button>
    <button class="p" onclick="saveSettings()">Save</button>
  </div>
  <p id="dlgerr" class="err" style="font-size:12px"></p>
</dialog>

<dialog id="appr">
  <h3>Tool approval</h3>
  <p id="apprtext" style="font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button onclick="decide(false)">Deny</button>
    <button class="p" onclick="decide(true)">Allow</button>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s);
let conv=null, settings=null, presets=[], busy=false, curResp=null, pendingAppr=null;
const api=async(p,o={})=>{const r=await fetch(p,{headers:{'content-type':'application/json'},...o});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json()};

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function bubble(who,cls){
  const d=document.createElement('div');d.className='m '+cls;
  d.innerHTML=`<div class="who">${who}</div><div class="r" style="display:none"></div><div class="b"></div><div class="x"></div>`;
  $('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight;return d;
}

async function loadConvs(){
  const {conversations}=await api('/api/conversations');
  $('#side').innerHTML='';
  conversations.forEach(c=>{
    const d=document.createElement('div');d.className='c'+(c.id===conv?' on':'');
    d.textContent=(c.starred?'★ ':'')+c.title;
    d.onclick=()=>openConv(c.id);
    $('#side').appendChild(d);
  });
}

async function openConv(id){
  conv=id;const {messages}=await api('/api/conversations/'+id);
  $('#log').innerHTML='';
  messages.forEach(m=>{
    const d=bubble(m.sender,m.sender==='user'?'u':'a');
    if(m.reasoning){const r=d.querySelector('.r');r.style.display='';r.textContent=m.reasoning}
    d.querySelector('.b').textContent=m.text;
    renderExtras(d,m);
  });
  loadConvs();
}

function renderExtras(d,m){
  const x=d.querySelector('.x');
  (m.tool_results||[]).forEach(t=>{const e=document.createElement('div');e.className='t';e.textContent=`${t.ok?'✓':'✗'} ${t.name} (${t.duration_ms}ms)\n${(t.content||'').slice(0,400)}`;x.appendChild(e)});
  if((m.search_results||[]).length){const e=document.createElement('div');e.className='cite';e.innerHTML=m.search_results.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`).join(' · ');x.appendChild(e)}
  (m.generated_images||[]).forEach(u=>{const i=document.createElement('img');i.src=u;i.style.maxWidth='260px';i.style.borderRadius='8px';i.style.marginTop='6px';x.appendChild(i)});
  if(m.error){const e=document.createElement('div');e.className='t err';e.textContent=m.error;x.appendChild(e)}
}

function newChat(){conv=null;$('#log').innerHTML='';loadConvs()}

async function send(){
  const text=$('#in').value.trim();if(!text||busy)return;
  $('#in').value='';busy=true;$('#send').style.display='none';$('#stop').style.display='';
  const u=bubble('you','u');u.querySelector('.b').textContent=text;
  const a=bubble('assistant','a');const body=a.querySelector('.b'),reas=a.querySelector('.r');
  const msg={id:null,tool_results:[],search_results:[],generated_images:[]};
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
      conversation_id:conv,message:text,agent:$('#agent').checked,reasoning:$('#reason').checked,
      search:$('#search').checked,image_generation:$('#img').checked,temporary:$('#temp').checked
    })});
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n');buf=parts.pop();
      for(const p of parts){
        const line=p.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
        let ev;try{ev=JSON.parse(line.slice(5).trim())}catch{continue}
        if(ev.type==='start'){conv=ev.conversation_id;curResp=ev.response_id}
        else if(ev.type==='delta'){body.textContent+=ev.text}
        else if(ev.type==='reasoning'){reas.style.display='';reas.textContent+=ev.text}
        else if(ev.type==='tool_result'){msg.tool_results.push(ev.result);renderExtras(a,msg);msg.tool_results=[]}
        else if(ev.type==='search'){msg.search_results=ev.results;renderExtras(a,msg)}
        else if(ev.type==='images'){msg.generated_images=ev.urls;renderExtras(a,msg)}
        else if(ev.type==='usage'){$('#usage').textContent=`${ev.usage.total_tokens} tokens`}
        else if(ev.type==='approval_required'){pendingAppr=ev;$('#apprtext').textContent=`${ev.call.name}  [risk: ${ev.risk}]\n${ev.call.arguments}`;$('#appr').showModal()}
        else if(ev.type==='error'){const e=document.createElement('div');e.className='t err';e.textContent=ev.message;a.querySelector('.x').appendChild(e)}
      }
      $('#log').scrollTop=$('#log').scrollHeight;
    }
  }catch(e){const d=document.createElement('div');d.className='t err';d.textContent=e.message;a.querySelector('.x').appendChild(d)}
  busy=false;curResp=null;$('#send').style.display='';$('#stop').style.display='none';loadConvs();
}

async function decide(ok){
  $('#appr').close();
  if(pendingAppr){await api('/api/approvals/'+pendingAppr.approval_id,{method:'POST',body:JSON.stringify({approved:ok})});pendingAppr=null}
}
async function stop(){if(curResp)await api('/api/stop',{method:'POST',body:JSON.stringify({response_id:curResp})})}

async function openSettings(){
  settings=await api('/api/settings');
  const p=settings.providers[0]||{};
  $('#base').value=p.base_url||'';$('#key').value='';$('#mdl').value=p.model||'';
  $('#lang').value=settings.language||'en';$('#sys').value=settings.system_prompt||'';
  const r=await api('/api/presets');presets=r.presets;
  $('#preset').innerHTML='<option value="">— choose —</option>'+presets.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('');
  $('#dlgerr').textContent='';$('#dlg').showModal();
}
function applyPreset(){const p=presets[$('#preset').value];if(!p)return;$('#base').value=p.base_url;$('#mdl').value=p.model}
async function saveSettings(){
  try{
    const s=settings;const p=s.providers[0];
    p.base_url=$('#base').value.trim();p.model=$('#mdl').value.trim();
    if($('#key').value.trim())p.api_key=$('#key').value.trim();
    s.language=$('#lang').value;s.system_prompt=$('#sys').value;
    await api('/api/settings',{method:'PUT',body:JSON.stringify(s)});
    document.documentElement.dir=s.language==='fa'?'rtl':'ltr';
    $('#model').textContent=p.model;$('#dlg').close();
  }catch(e){$('#dlgerr').textContent=e.message}
}

$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px'});

(async()=>{
  const h=await api('/api/health');$('#model').textContent=h.active_model||'no model';
  const s=await api('/api/settings');document.documentElement.dir=s.language==='fa'?'rtl':'ltr';
  await loadConvs();
})();
</script>
</body>
</html>
