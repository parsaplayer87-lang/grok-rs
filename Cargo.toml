[workspace]
resolver = "2"
members = ["crates/grok-core", "crates/grok-server", "crates/grok-cli", "crates/grok-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/parsaplayer87-lang/grok-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "fs", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "gzip", "charset", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "custom-provider"] }
rustls-rustcrypto = { version = "0.1.0-pre.0", default-features = false, features = ["std", "tls12"] }
webpki-roots = "1"
futures-util = "0.3"
redb = "2"
url = "2"
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"
async-trait = "0.1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
regex = "1"
urlencoding = "2"
base64 = "0.22"
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true